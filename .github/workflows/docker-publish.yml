name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]
  # Hiermee krijg je de handmatige "Run workflow" knop in GitHub Actions
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # BELANGRIJK: Pas hieronder je gebruikersnaam en de gewenste image-naam aan
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/netronome:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/netronome:${{ github.sha }}
